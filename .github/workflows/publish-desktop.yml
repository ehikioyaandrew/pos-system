# Builds the Windows x64 setup.exe, signs updater artifacts, creates/updates a GitHub Release,
# and uploads the installer + latest.json so installed apps can "Check for updates".
#
# Uploaded assets (only):
#   - POS System_*_x64-setup.exe (+ .sig for updater)
#   - latest.json
#
# Note: GitHub always shows auto "Source code (zip/tar.gz)" links on tag releases —
# those cannot be disabled. We do not upload MSI or other extras.
#
# Triggers:
#   - Push a version tag:  git tag v1.0.1 && git push origin v1.0.1
#   - Push to the `release` branch
#   - Manual run from Actions → Publish Desktop → Run workflow
#
# Required GitHub secrets:
#   TAURI_SIGNING_PRIVATE_KEY_BASE64 — base64 of %USERPROFILE%\.tauri\pos-system.key
#       PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.tauri\pos-system.key"))
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY — required for Sync now (upserts to *_backup); baked into the build
#
# Do NOT set TAURI_SIGNING_PRIVATE_KEY_PASSWORD unless the key was created with a password.

name: Publish Desktop

on:
  push:
    tags:
      - 'v*'
    branches:
      - release
  workflow_dispatch:

jobs:
  publish-windows:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # option_env! embeds these — cache must miss when secrets change
          env-vars: VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify Supabase secrets for desktop sync
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if (-not $env:VITE_SUPABASE_URL) { throw "Missing secret VITE_SUPABASE_URL" }
          if (-not $env:VITE_SUPABASE_ANON_KEY) { throw "Missing secret VITE_SUPABASE_ANON_KEY" }
          if (-not $env:SUPABASE_SERVICE_ROLE_KEY) { throw "Missing secret SUPABASE_SERVICE_ROLE_KEY (needed for Sync now)" }
          Write-Host "Supabase secrets present (URL length $($env:VITE_SUPABASE_URL.Length))"

      - name: Write updater signing key
        shell: pwsh
        env:
          KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_BASE64 }}
          KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP "tauri-signing.key"
          if ($env:KEY_B64) {
            $bytes = [Convert]::FromBase64String($env:KEY_B64.Trim())
            [IO.File]::WriteAllBytes($out, $bytes)
          } elseif ($env:KEY_RAW) {
            # Normalize escaped newlines from GitHub secret paste
            $text = $env:KEY_RAW -replace "`r`n", "`n" -replace "`r", "`n"
            if ($text -notmatch "untrusted comment:" -and $text -notmatch "`n") {
              # Likely a single-line base64 blob of the minisign key — decode if possible
              try {
                $bytes = [Convert]::FromBase64String($text.Trim())
                $decoded = [Text.Encoding]::UTF8.GetString($bytes)
                if ($decoded -match "untrusted comment:") {
                  [IO.File]::WriteAllText($out, $decoded)
                } else {
                  [IO.File]::WriteAllBytes($out, $bytes)
                }
              } catch {
                [IO.File]::WriteAllText($out, $text)
              }
            } else {
              [IO.File]::WriteAllText($out, $text)
            }
          } else {
            throw "Missing secret TAURI_SIGNING_PRIVATE_KEY_BASE64 (preferred) or TAURI_SIGNING_PRIVATE_KEY"
          }
          # Sanity: key must contain minisign comment (or be binary)
          $probe = [IO.File]::ReadAllText($out)
          if ($probe.Length -lt 32) { throw "Signing key file looks empty" }
          echo "TAURI_SIGNING_PRIVATE_KEY_PATH=$out" >> $env:GITHUB_ENV
          Write-Host "Signing key written ($((Get-Item $out).Length) bytes)"

      - name: Build and publish Tauri (Windows x64 setup.exe + updater JSON)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri build only reads TAURI_SIGNING_PRIVATE_KEY (file path or key text).
          # Do not set TAURI_SIGNING_PRIVATE_KEY_PASSWORD for unencrypted keys.
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          # Baked into the Rust binary via option_env! so installed app can sync
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'POS System v__VERSION__'
          releaseBody: |
            Windows **x64** desktop installer for offline POS.

            Download **`POS System_*_x64-setup.exe`**, right-click → Run as administrator.
            If SmartScreen appears: More info → Run anyway.

            Existing installs: use **Check for updates** in the app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseCommitish: ${{ github.sha }}

      - name: Keep only installer + updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Remove any accidental non-installer uploads (e.g. old MSI). GitHub's auto
          # "Source code" zip/tar.gz links cannot be deleted — they are not release assets.
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            "v$ver"
          }
          Write-Host "Cleaning release assets for $tag"
          $assets = gh release view $tag --json assets | ConvertFrom-Json | Select-Object -ExpandProperty assets
          foreach ($a in $assets) {
            $name = $a.name
            $keep = ($name -match '\-setup\.exe(\.sig)?$') -or ($name -eq 'latest.json')
            if (-not $keep) {
              Write-Host "Deleting asset: $name"
              gh api -X DELETE "repos/$($env:GITHUB_REPOSITORY)/releases/assets/$($a.id)"
            } else {
              Write-Host "Keeping asset: $name"
            }
          }
